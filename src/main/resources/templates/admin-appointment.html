<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Create Appointment</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center">Create Appointment</h2>

    <form th:action="@{/admin/appointments}" th:object="${appointment}" method="post">
        <!-- Select Doctor -->
        <div class="form-group">
            <label for="doctor">Select Doctor:</label>
            <select id="doctor" th:field="*{doctor}" class="form-control" required>
                <option th:each="doctor : ${doctors}" th:value="${doctor.id}" th:text="${doctor.name}"></option>
            </select>
        </div>

        <!-- Select Person -->
        <div class="form-group">
            <label for="person">Select Person:</label>
            <select id="person" th:field="*{person}" class="form-control" required>
                <option th:each="person : ${patients}" th:value="${person.id}" th:text="${person.name}"></option>
            </select>
        </div>

        <!-- Date -->
        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" th:field="*{date}" class="form-control" required>
        </div>

        <!-- Time -->
        <div class="form-group">
            <label for="time">Time:</label>
            <input type="time" id="time" th:field="*{time}" class="form-control" required>
        </div>

        <!-- Price -->
        <div class="form-group">
            <label for="price">Price:</label>
            <input type="number" id="price" th:field="*{price}" class="form-control" step="0.01" required>
        </div>

        <button type="submit" class="btn btn-success">Create Appointment</button>
    </form>
</div>
</body>
</html>
