<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Schedule Management</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Appointment</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
          integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .time-slot {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }

        .time-slot:hover {
            background-color: #f8f9fa;
        }

        .selected {
            background-color: #007bff;
            color: white;
        }

        .unavailable {
            background-color: #dc3545;
            color: white;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top "style="font-family: 'Poppins', sans-serif;">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo03" aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand text-capitalize" href="#"><img src="../../sign.jpg" width="40" height="40" alt="logo" loading="lazy" class="mr-2">Doctor's Appointment</a>

        <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
            <ul class="navbar-nav ml-auto mt-2 mt-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="home.html"> <i class="fa fa-home mr-1" aria-hidden="true"></i>Home</a>
                </li>
                <li class="nav-item ">
                    <a class="nav-link" href="appointed.html"><i class="fa fa-hospital-o mr-1" aria-hidden="true"></i>My Appointments</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="doctors.html"><i class="fa fa-medkit mr-1" aria-hidden="true"></i>Doctors<span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/doctor/schedule}"><i class="fa fa-user mr-1" aria-hidden="true"></i>Schedule</a>
                </li>
                <button type="button" class="btn btn-outline btn-md btn-warning ml-4"><i class="fa fa-sign-out"></i>Logout</button>
            </ul>
        </div>
    </nav>
</header>
<div class="container mt-5">
    <h2>Schedule Management</h2>

    <div class="row mt-4">
        <div class="col-md-6">
            <h4>Select Date</h4>
            <select id="dateSelect" class="form-select">
                <option value="">Choose a date</option>
                <option th:each="date : ${availableDates}"
                        th:value="${date}"
                        th:text="${#temporals.format(date, 'EEEE, MMMM d, yyyy')}">
                </option>
            </select>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <h4>Time Range</h4>
            <div class="mb-3">
                <label>Start Time</label>
                <select id="startTime" class="form-select">
                    <option value="">Select start time</option>
                    <option th:each="time : ${timeSlots}"
                            th:value="${time}"
                            th:text="${#temporals.format(time, 'HH:mm')}">
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label>End Time</label>
                <select id="endTime" class="form-select">
                    <option value="">Select end time</option>
                    <option th:each="time : ${timeSlots}"
                            th:value="${time}"
                            th:text="${#temporals.format(time, 'HH:mm')}">
                    </option>
                </select>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <h4>Appointment Duration</h4>
            <select id="duration" class="form-select">
                <option value="15">15 minutes</option>
                <option value="30" selected>30 minutes</option>
                <option value="45">45 minutes</option>
                <option value="60">60 minutes</option>
            </select>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <button id="createSchedule" class="btn btn-primary">Create Appointments</button>
        </div>
    </div>

    <div id="message" class="mt-3"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
        $('#createSchedule').click(function () {
            const date = $('#dateSelect').val();
            const startTime = $('#startTime').val();
            const endTime = $('#endTime').val();
            const duration = $('#duration').val();

            if (!date || !startTime || !endTime) {
                $('#message').html('<div class="alert alert-danger">Please select all required fields</div>');
                return;
            }

            if (startTime >= endTime) {
                $('#message').html('<div class="alert alert-danger">End time must be after start time</div>');
                return;
            }

            $.ajax({
                url: '/doctor/create-appointments',
                method: 'POST',
                data: {
                    date: date,
                    startTime: startTime,
                    endTime: endTime,
                    durationMinutes: duration,
                    doctorEmail: 'current-doctor@email.com' // This should be dynamically set based on logged-in doctor
                },
                success: function (response) {
                    $('#message').html('<div class="alert alert-success">Appointments created successfully!</div>');
                },
                error: function (xhr) {
                    $('#message').html('<div class="alert alert-danger">Error creating appointments</div>');
                }
            });
        });

        // Validate time slot availability when selecting times
        $('#startTime, #endTime').change(function () {
            const date = $('#dateSelect').val();
            const time = $(this).val();

            if (date && time) {
                $.get('/doctor/check-availability', {
                    date: date,
                    time: time,
                    doctorEmail: 'current-doctor@email.com' // This should be dynamically set
                }, function (isAvailable) {
                    if (!isAvailable) {
                        $('#message').html('<div class="alert alert-warning">Selected time slot is already booked</div>');
                    } else {
                        $('#message').html('');
                    }
                });
            }
        });
    });
</script>
</body>
</html>
