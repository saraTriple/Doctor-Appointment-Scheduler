<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments List</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <a class="navbar-brand text-capitalize" href="#">
            <img src="../../sign.jpg" width="40" height="40" alt="logo" loading="lazy" class="mr-2">
            Admin Dashboard
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}">
                        <i class="fa fa-home mr-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/doctors}">
                        <i class="fa fa-user-md mr-1"></i> Doctors
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/patients}">
                        <i class="fa fa-user mr-1"></i> Patients
                    </a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/admin/appointments}">
                        <i class="fa fa-calendar-check mr-1"></i> Appointments
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger font-weight-bold" th:href="@{/logout}">
                        <i class="fa fa-sign-out-alt mr-1"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Appointments List</h2>
        <a th:href="@{/admin/schedule}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Schedule New Appointment
        </a>
    </div>

    <!-- Appointment Filtering -->
    <form th:action="@{/admin/appointments}" method="get" class="mb-4">
        <div class="row">
            <div class="col-md-3">
                <select name="doctorEmail" class="form-control">
                    <option value="">All Doctors</option>
                    <option th:each="doctor : ${doctors}"
                            th:value="${doctor.email}"
                            th:text="${doctor.name}"
                            th:selected="${param.doctorEmail != null && param.doctorEmail[0] == doctor.email}">
                    </option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="status" class="form-control">
                    <option value="">All Statuses</option>
                    <option value="SCHEDULED" th:selected="${param.status != null && param.status[0] == 'SCHEDULED'}">Scheduled</option>
                    <option value="COMPLETED" th:selected="${param.status != null && param.status[0] == 'COMPLETED'}">Completed</option>
                    <option value="CANCELLED" th:selected="${param.status != null && param.status[0] == 'CANCELLED'}">Cancelled</option>
                    <option value="NO_SHOW" th:selected="${param.status != null && param.status[0] == 'NO_SHOW'}">No Show</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-filter"></i> Filter
                </button>
            </div>
        </div>
    </form>

    <!-- List of Appointments -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Time</th>
                <th>Doctor</th>
                <th>Patient</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="appointment : ${appointments}">
                <td th:text="${appointment.id}"></td>
                <td th:text="${#temporals.format(appointment.date, 'dd-MM-yyyy')}"></td>
                <td th:text="${appointment.time}"></td>
                <td th:text="${appointment.doctor.name }"></td>
                <td th:text="${appointment.person.firstName + ' ' + appointment.person.lastName}"></td>
                <td>
                    <span th:class="${'badge ' + 
                        (appointment.appointmentStatus.status == 'SCHEDULED' ? 'badge-primary' :
                        (appointment.appointmentStatus.status == 'COMPLETED' ? 'badge-success' :
                        (appointment.appointmentStatus.status == 'CANCELLED' ? 'badge-danger' : 'badge-warning')))}"
                          th:text="${appointment.appointmentStatus.status}">
                    </span>
                </td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/admin/appointment/{id}(id=${appointment.id})}" 
                           class="btn btn-sm btn-info" title="View Details">
                            <i class="fas fa-eye"></i>
                        </a>
                        <button type="button" class="btn btn-sm btn-warning" title="Edit"
                                data-toggle="modal" th:data-target="'#editModal' + ${appointment.id}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button type="button" class="btn btn-sm btn-danger" title="Cancel"
                                data-toggle="modal" th:data-target="'#cancelModal' + ${appointment.id}">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <!-- Edit Modal -->
                    <div class="modal fade" th:id="'editModal' + ${appointment.id}" tabindex="-1" role="dialog">
                        <div class="modal-dialog" role="document">
                            <div class="modal-content">
                                <form th:action="@{/admin/appointment/{id}/edit(id=${appointment.id})}" method="post">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Edit Appointment</h5>
                                        <button type="button" class="close" data-dismiss="modal">
                                            <span>&times;</span>
                                        </button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="form-group">
                                            <label>Status</label>
                                            <select name="status" class="form-control">
                                                <option value="SCHEDULED" th:selected="${appointment.appointmentStatus.status == 'SCHEDULED'}">Scheduled</option>
                                                <option value="COMPLETED" th:selected="${appointment.appointmentStatus.status == 'COMPLETED'}">Completed</option>
                                                <option value="CANCELLED" th:selected="${appointment.appointmentStatus.status == 'CANCELLED'}">Cancelled</option>
                                                <option value="NO_SHOW" th:selected="${appointment.appointmentStatus.status == 'NO_SHOW'}">No Show</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                        <button type="submit" class="btn btn-primary">Save changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Cancel Modal -->
                    <div class="modal fade" th:id="'cancelModal' + ${appointment.id}" tabindex="-1" role="dialog">
                        <div class="modal-dialog" role="document">
                            <div class="modal-content">
                                <form th:action="@{/admin/appointment/{id}/cancel(id=${appointment.id})}" method="post">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Cancel Appointment</h5>
                                        <button type="button" class="close" data-dismiss="modal">
                                            <span>&times;</span>
                                        </button>
                                    </div>
                                    <div class="modal-body">
                                        <p>Are you sure you want to cancel this appointment?</p>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                                        <button type="submit" class="btn btn-danger">Yes, Cancel</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? disabled">
                <a class="page-link" th:href="@{/admin/appointments(page=${currentPage - 1}, size=10, doctorEmail=${param.doctorEmail}, status=${param.status})}">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${currentPage == i} ? active">
                <a class="page-link" th:href="@{/admin/appointments(page=${i}, size=10, doctorEmail=${param.doctorEmail}, status=${param.status})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? disabled">
                <a class="page-link" th:href="@{/admin/appointments(page=${currentPage + 1}, size=10, doctorEmail=${param.doctorEmail}, status=${param.status})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</body>
</html>
