<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor's Patients</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
        function filterPatients() {
            let inputName = document.getElementById("filterName").value.toLowerCase();
            let inputEmail = document.getElementById("filterEmail").value.toLowerCase();

            let table = document.getElementById("patientsTable");
            let rows = table.getElementsByTagName("tr");

            for (let i = 1; i < rows.length; i++) {
                let name = rows[i].getElementsByTagName("td")[0].innerText.toLowerCase();
                let email = rows[i].getElementsByTagName("td")[1].innerText.toLowerCase();

                if ((name.includes(inputName) || inputName === "") &&
                    (email.includes(inputEmail) || inputEmail === "")) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }
    </script>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <a class="navbar-brand text-capitalize" href="#">
            <img src="../../sign.jpg" width="40" height="40" alt="logo" loading="lazy" class="mr-2">
            Admin Dashboard
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/home}">
                        <i class="fa fa-home mr-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/doctors}">
                        <i class="fa fa-user-md mr-1"></i> Doctors List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/patients}">
                        <i class="fa fa-user mr-1"></i> Patients List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/appointments}">
                        <i class="fa fa-calendar-check mr-1"></i> Appointments List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger font-weight-bold" th:href="@{/logout}">
                        <i class="fa fa-sign-out-alt mr-1"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<div class="container mt-5">
    <div class="row mb-4">
        <div class="col">
            <h2 class="text-center">
                Patients of Dr. <span th:text="${doctor.name}"></span>
                <small class="text-muted">(<span th:text="${doctor.specialization}"></span>)</small>
            </h2>
        </div>
    </div>

    <!-- Patient Filtering -->
    <div class="row mb-4">
        <div class="col-md-6">
            <input type="text" id="filterName" class="form-control" onkeyup="filterPatients()" placeholder="Filter by Name">
        </div>
        <div class="col-md-6">
            <input type="text" id="filterEmail" class="form-control" onkeyup="filterPatients()" placeholder="Filter by Email">
        </div>
    </div>

    <!-- Patients Table -->
    <div class="table-responsive">
        <table id="patientsTable" class="table table-bordered table-hover">
            <thead class="thead-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Last Visit</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="patient : ${patients}">
                <td th:text="${patient.firstName + ' ' + patient.lastName}"></td>
                <td th:text="${patient.email}"></td>
                <td th:text="${patient.phoneNumber}"></td>
                <td th:text="${patient.lastVisit != null ? #temporals.format(patient.lastVisit, 'dd MMM yyyy') : 'Never'}"></td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{'/admin/patient/' + ${patient.id} + '/details'}" class="btn btn-info btn-sm">
                            <i class="fas fa-eye"></i> View Details
                        </a>
                        <a th:href="@{'/admin/patient/' + ${patient.id} + '/prescriptions'}" class="btn btn-success btn-sm">
                            <i class="fas fa-prescription"></i> Prescriptions
                        </a>
                        <a th:href="@{'/admin/doctor/' + ${doctor.id} + '/patient/' + ${patient.id} + '/appointments'}" class="btn btn-primary btn-sm">
                            <i class="fas fa-calendar-alt"></i> Appointments
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Required JavaScript -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
