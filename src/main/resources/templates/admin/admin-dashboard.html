<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <style>
        .dashboard-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 10px;
            background: white;
            height: 100%;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #0d6efd;
        }
        .stats-card {
            background: linear-gradient(45deg, #0d6efd, #0a58ca);
            color: white;
        }
        .report-section {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
        }
        .chart-container {
            height: 300px;
            margin: 20px 0;
        }
    </style>
</head>
<body class="bg-light">
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-capitalize" href="#">
                <i class="fas fa-hospital-user me-2"></i>
                Admin Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/home}">
                            <i class="fas fa-home me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/doctors}">
                            <i class="fas fa-user-md me-1"></i> Doctors
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/patients}">
                            <i class="fas fa-user me-1"></i> Patients
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/appointments}">
                            <i class="fas fa-calendar-check me-1"></i> Appointments
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/reports}">
                            <i class="fas fa-file-alt me-1"></i> Reports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" th:href="@{/logout}">
                            <i class="fas fa-sign-out-alt me-1"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<div class="container py-4">
    <!-- Stats Overview -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="dashboard-card stats-card p-3 text-center">
                <i class="fas fa-user-md card-icon"></i>
                <h3 th:text="${doctorCount}">0</h3>
                <p class="mb-0">Total Doctors</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card stats-card p-3 text-center">
                <i class="fas fa-users card-icon"></i>
                <h3 th:text="${patientCount}">0</h3>
                <p class="mb-0">Total Patients</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card stats-card p-3 text-center">
                <i class="fas fa-calendar-check card-icon"></i>
                <h3 th:text="${appointmentCount}">0</h3>
                <p class="mb-0">Total Appointments</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card stats-card p-3 text-center">
                <i class="fas fa-dollar-sign card-icon"></i>
                <h3 th:text="${totalRevenue}">$0</h3>
                <p class="mb-0">Total Revenue</p>
            </div>
        </div>
    </div>

    <!-- Reports Section -->
    <div class="report-section">
        <h3 class="mb-4">Quick Reports</h3>
        <div class="row g-4">
            <!-- Income Report -->
            <div class="col-md-4">
                <div class="dashboard-card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">Income Report</h5>
                        <i class="fas fa-dollar-sign card-icon"></i>
                    </div>
                    <form action="/admin/reports/income" method="GET" target="_blank">
                        <div class="mb-3">
                            <label class="form-label">Date Range</label>
                            <input type="text" class="form-control daterange" name="dateRange" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Doctor</label>
                            <select class="form-select" name="doctorId">
                                <option value="">All Doctors</option>
                                <option th:each="doctor : ${doctors}" 
                                        th:value="${doctor.id}" 
                                        th:text="${doctor.name}">Doctor Name</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Generate Report</button>
                    </form>
                </div>
            </div>

            <!-- Appointment Status Report -->
            <div class="col-md-4">
                <div class="dashboard-card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">Status Report</h5>
                        <i class="fas fa-chart-pie card-icon"></i>
                    </div>
                    <form action="/admin/reports/status" method="GET" target="_blank">
                        <div class="mb-3">
                            <label class="form-label">Date Range</label>
                            <input type="text" class="form-control daterange" name="dateRange" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="">All Statuses</option>
                                <option value="SCHEDULED">Scheduled</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="CANCELLED">Cancelled</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Generate Report</button>
                    </form>
                </div>
            </div>

            <!-- Doctor Performance Report -->
            <div class="col-md-4">
                <div class="dashboard-card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">Performance Report</h5>
                        <i class="fas fa-user-md card-icon"></i>
                    </div>
                    <form action="/admin/reports/performance" method="GET" target="_blank">
                        <div class="mb-3">
                            <label class="form-label">Date Range</label>
                            <input type="text" class="form-control daterange" name="dateRange" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Specialty</label>
                            <select class="form-select" name="specialty">
                                <option value="">All Specialties</option>
                                <option th:each="specialty : ${specialties}"
                                        th:value="${specialty}"
                                        th:text="${specialty}">Specialty</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Generate Report</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts Section -->
    <div class="row g-4">
        <div class="col-md-6">
            <div class="dashboard-card p-3">
                <h5>Appointments by Status</h5>
                <div class="chart-container">
                    <canvas id="appointmentStatusChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="dashboard-card p-3">
                <h5>Revenue Trend</h5>
                <div class="chart-container">
                    <canvas id="revenueTrendChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize date pickers
        flatpickr(".daterange", {
            mode: "range",
            dateFormat: "Y-m-d",
            maxDate: "today"
        });

        // Initialize charts
        const statusCtx = document.getElementById('appointmentStatusChart').getContext('2d');
        new Chart(statusCtx, {
            type: 'doughnut',
            data: {
                labels: ['Scheduled', 'Completed', 'Cancelled'],
                datasets: [{
                    data: [[${statusData}]],
                    backgroundColor: ['#0d6efd', '#198754', '#dc3545']
                }]
            }
        });

        const revenueCtx = document.getElementById('revenueTrendChart').getContext('2d');
        new Chart(revenueCtx, {
            type: 'line',
            data: {
                labels: [[${revenueDates}]],
                datasets: [{
                    label: 'Revenue',
                    data: [[${revenueData}]],
                    borderColor: '#0d6efd',
                    tension: 0.1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });
</script>
</body>
</html>
