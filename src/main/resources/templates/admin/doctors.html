<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctors Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
        function filterDoctors() {
            let inputName = document.getElementById("filterName").value.toLowerCase();
            let inputEmail = document.getElementById("filterEmail").value.toLowerCase();
            let inputSpecialization = document.getElementById("filterSpecialization").value.toLowerCase();

            let table = document.getElementById("doctorsTable");
            let rows = table.getElementsByTagName("tr");

            for (let i = 1; i < rows.length; i++) {
                let name = rows[i].getElementsByTagName("td")[0].innerText.toLowerCase();
                let email = rows[i].getElementsByTagName("td")[1].innerText.toLowerCase();
                let specialization = rows[i].getElementsByTagName("td")[2].innerText.toLowerCase();

                if ((name.includes(inputName) || inputName === "") &&
                    (email.includes(inputEmail) || inputEmail === "") &&
                    (specialization.includes(inputSpecialization) || inputSpecialization === "")) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }
    </script>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <a class="navbar-brand text-capitalize" href="#">
            <img src="../../sign.jpg" width="40" height="40" alt="logo" loading="lazy" class="mr-2">
            Admin Dashboard
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/home}">
                        <i class="fa fa-home mr-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/doctors}">
                        <i class="fa fa-user-md mr-1"></i> Doctors List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/patients}">
                        <i class="fa fa-user mr-1"></i> Patients List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/appointments}">
                        <i class="fa fa-calendar-check mr-1"></i> Appointments List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger font-weight-bold" th:href="@{/logout}">
                        <i class="fa fa-sign-out-alt mr-1"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<div class="container mt-5">
    <h2 class="text-center mb-4">Doctors Management</h2>

    <!-- Doctor Filtering -->
    <div class="row mb-4">
        <div class="col-md-4">
            <input type="text" id="filterName" class="form-control" onkeyup="filterDoctors()" placeholder="Filter by Name">
        </div>
        <div class="col-md-4">
            <input type="text" id="filterEmail" class="form-control" onkeyup="filterDoctors()" placeholder="Filter by Email">
        </div>
        <div class="col-md-4">
            <input type="text" id="filterSpecialization" class="form-control" onkeyup="filterDoctors()" placeholder="Filter by Specialization">
        </div>
    </div>

    <!-- Add New Doctor Button -->
    <div class="text-right mb-3">
        <button class="btn btn-primary" data-toggle="modal" data-target="#addDoctorModal">
            <i class="fas fa-plus"></i> Add New Doctor
        </button>
    </div>

    <!-- Doctors List -->
    <div class="table-responsive">
        <table id="doctorsTable" class="table table-bordered table-hover">
            <thead class="thead-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Specialization</th>
                <th>Appointments</th>
                <th>Patients</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="doctor : ${doctors}">
                <td th:text="${doctor.name}"></td>
                <td th:text="${doctor.email}"></td>
                <td th:text="${doctor.specialization}"></td>
                <td>
                    <a th:href="@{'/admin/doctor/' + ${doctor.id} + '/appointments'}" class="btn btn-info btn-sm">
                        <i class="fas fa-calendar-alt"></i> View
                    </a>
                </td>
                <td>
                    <a th:href="@{'/admin/doctor/' + ${doctor.id} + '/patients'}" class="btn btn-info btn-sm">
                        <i class="fas fa-users"></i> View
                    </a>
                </td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{'/admin/doctor/' + ${doctor.id} + '/edit'}" class="btn btn-warning btn-sm">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <button class="btn btn-danger btn-sm" th:onclick="'deleteDoctor(' + ${doctor.id} + ')'">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Doctor Modal -->
<div class="modal fade" id="addDoctorModal" tabindex="-1" role="dialog" aria-labelledby="addDoctorModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addDoctorModalLabel">Add New Doctor</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form th:action="@{/admin/doctor/add}" method="post">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="specialization">Specialization</label>
                        <input type="text" class="form-control" id="specialization" name="specialization" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Add Doctor</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Delete</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this doctor? This action cannot be undone.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- Required JavaScript -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    let doctorIdToDelete = null;

    function deleteDoctor(id) {
        doctorIdToDelete = id;
        $('#deleteConfirmModal').modal('show');
    }

    function confirmDelete() {
        if (doctorIdToDelete) {
            window.location.href = '/admin/doctor/' + doctorIdToDelete + '/delete';
        }
    }
</script>
</body>
</html>
