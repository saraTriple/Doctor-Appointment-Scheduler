<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor's Appointments</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
        function filterAppointments() {
            let inputDate = document.getElementById("filterDate").value.toLowerCase();
            let inputTime = document.getElementById("filterTime").value.toLowerCase();
            let inputPatient = document.getElementById("filterPatient").value.toLowerCase();
            let inputStatus = document.getElementById("filterStatus").value.toLowerCase();

            let table = document.getElementById("appointmentsTable");
            let rows = table.getElementsByTagName("tr");

            for (let i = 1; i < rows.length; i++) {
                let date = rows[i].getElementsByTagName("td")[0].innerText.toLowerCase();
                let time = rows[i].getElementsByTagName("td")[1].innerText.toLowerCase();
                let patient = rows[i].getElementsByTagName("td")[2].innerText.toLowerCase();
                let status = rows[i].getElementsByTagName("td")[3].innerText.toLowerCase();

                if ((date.includes(inputDate) || inputDate === "") &&
                    (time.includes(inputTime) || inputTime === "") &&
                    (patient.includes(inputPatient) || inputPatient === "") &&
                    (status.includes(inputStatus) || inputStatus === "")) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }
    </script>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <a class="navbar-brand text-capitalize" href="#">
            <img src="../../sign.jpg" width="40" height="40" alt="logo" loading="lazy" class="mr-2">
            Admin Dashboard
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/home}">
                        <i class="fa fa-home mr-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/doctors}">
                        <i class="fa fa-user-md mr-1"></i> Doctors List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/patients}">
                        <i class="fa fa-user mr-1"></i> Patients List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/appointments}">
                        <i class="fa fa-calendar-check mr-1"></i> Appointments List
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger font-weight-bold" th:href="@{/logout}">
                        <i class="fa fa-sign-out-alt mr-1"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<div class="container mt-5">
    <div class="row mb-4">
        <div class="col">
            <h2 class="text-center">
                Appointments for Dr. <span th:text="${doctor.name}"></span>
                <small class="text-muted">(<span th:text="${doctor.specialization}"></span>)</small>
            </h2>
        </div>
    </div>

    <!-- Appointment Filtering -->
    <div class="row mb-4">
        <div class="col-md-3">
            <input type="date" id="filterDate" class="form-control" onchange="filterAppointments()" placeholder="Filter by Date">
        </div>
        <div class="col-md-3">
            <input type="time" id="filterTime" class="form-control" onchange="filterAppointments()" placeholder="Filter by Time">
        </div>
        <div class="col-md-3">
            <input type="text" id="filterPatient" class="form-control" onkeyup="filterAppointments()" placeholder="Filter by Patient">
        </div>
        <div class="col-md-3">
            <select id="filterStatus" class="form-control" onchange="filterAppointments()">
                <option value="">All Statuses</option>
                <option value="scheduled">Scheduled</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>
    </div>

    <!-- Add New Appointment Button -->
    <div class="text-right mb-3">
        <button class="btn btn-primary" data-toggle="modal" data-target="#addAppointmentModal">
            <i class="fas fa-plus"></i> Schedule New Appointment
        </button>
    </div>

    <!-- Appointments Table -->
    <div class="table-responsive">
        <table id="appointmentsTable" class="table table-bordered table-hover">
            <thead class="thead-dark">
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Patient</th>
                <th>Status</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="appointment : ${appointments}">
                <td th:text="${#temporals.format(appointment.date, 'dd MMM yyyy')}"></td>
                <td th:text="${appointment.time}"></td>
                <td th:text="${appointment.person.firstName + ' ' + appointment.person.lastName}"></td>
                <td th:text="${appointment.appointmentStatus.status}"></td>
                <td>$<span th:text="${#numbers.formatDecimal(appointment.price != null ? appointment.price : 10, 1, 2)}"></span></td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{'/admin/appointment/' + ${appointment.id}}" class="btn btn-info btn-sm">
                            <i class="fas fa-eye"></i> View
                        </a>
                        <button class="btn btn-warning btn-sm" th:onclick="'editAppointment(' + ${appointment.id} + ')'">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn btn-danger btn-sm" th:onclick="'deleteAppointment(' + ${appointment.id} + ')'">
                            <i class="fas fa-trash"></i> Cancel
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Appointment Modal -->
<div class="modal fade" id="addAppointmentModal" tabindex="-1" role="dialog" aria-labelledby="addAppointmentModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addAppointmentModalLabel">Schedule New Appointment</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form th:action="@{'/admin/doctor/' + ${doctor.id} + '/appointment/add'}" method="post">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="patient">Patient</label>
                        <select class="form-control" id="patient" name="patientId" required>
                            <option value="">Select Patient</option>
                            <option th:each="patient : ${patients}" 
                                    th:value="${patient.id}" 
                                    th:text="${patient.firstName + ' ' + patient.lastName}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="appointmentDate">Date</label>
                        <input type="date" class="form-control" id="appointmentDate" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="appointmentTime">Time</label>
                        <input type="time" class="form-control" id="appointmentTime" name="time" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Price ($)</label>
                        <input type="number" class="form-control" id="price" name="price" value="10" min="0" step="0.01" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Schedule Appointment</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Cancellation</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                Are you sure you want to cancel this appointment?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <button type="button" class="btn btn-danger" onclick="confirmDelete()">Yes, Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- Required JavaScript -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    let appointmentIdToDelete = null;

    function deleteAppointment(id) {
        appointmentIdToDelete = id;
        $('#deleteConfirmModal').modal('show');
    }

    function confirmDelete() {
        if (appointmentIdToDelete) {
            window.location.href = '/admin/appointment/' + appointmentIdToDelete + '/cancel';
        }
    }

    function editAppointment(id) {
        window.location.href = '/admin/appointment/' + id + '/edit';
    }
</script>
</body>
</html>
