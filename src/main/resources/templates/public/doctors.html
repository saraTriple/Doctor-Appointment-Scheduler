<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Doctors - Patient Appointment System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .doctor-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin-bottom: 20px;
        }

        .doctor-card:hover {
            transform: translateY(-5px);
        }

        .search-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fa fa-hospital-o mr-2"></i>Patient Appointment System
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="fa fa-home"></i> Home</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="/doctors"><i class="fa fa-user-md"></i> Doctors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/appointments"><i class="fa fa-calendar"></i> Appointments</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="loginDropdown" role="button"
                       data-toggle="dropdown">
                        <i class="fa fa-sign-in"></i> Login
                    </a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="/patient/login">
                            <i class="fa fa-user"></i> Patient Login
                        </a>
                        <a class="dropdown-item" href="/doctor/login">
                            <i class="fa fa-user-md"></i> Doctor Login
                        </a>
                        <a class="dropdown-item" href="/admin/login">
                            <i class="fa fa-cog"></i> Admin Login
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Find Doctors</h2>

    <!-- Search Section -->
    <div class="search-section">
        <form method="get" class="row">
            <div class="col-md-3">
                <div class="form-group">
                    <label>Doctor Name</label>
                    <input type="text" class="form-control" name="name" th:value="${param.name}"
                           placeholder="Enter doctor name">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label>Specialty</label>
                    <input type="text" class="form-control" name="specialization" th:value="${param.specialization}"
                           placeholder="Enter specialty">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" class="form-control" name="state" th:value="${param.state}"
                           placeholder="Enter location">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fa fa-search"></i> Search
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Doctors List -->
    <div class="row">
        <div class="col-md-4" th:each="doctor : ${doctors}">
            <div class="card doctor-card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${doctor.name}">Doctor Name</h5>
                    <p class="text-muted" th:text="${doctor.specialization}">Specialization</p>
                    <hr>
                    <p><i class="fa fa-map-marker"></i> <span th:text="${doctor.state}">Location</span></p>
                    <p><i class="fa fa-envelope"></i> <span th:text="${doctor.email}">Email</span></p>
                    <div class="text-center mt-3">
                        <a th:href="@{'/doctors/' + ${doctor.email}}" class="btn btn-outline-primary">
                            <i class="fa fa-calendar"></i> View Available Slots
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- No Results Message -->
    <div th:if="${doctors.empty}" class="alert alert-info">
        <i class="fa fa-info-circle"></i> No doctors found matching your criteria.
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
