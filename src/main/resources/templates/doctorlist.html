<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Appointment - Find a Doctor</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        .search-section {
            background-color: #f8f9fa;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .doctor-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .doctor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top" style="font-family: 'Poppins', sans-serif;">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo03">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand text-capitalize" href="#">
                <img src="sign.jpg" width="40" height="40" alt="logo" loading="lazy" class="mr-2">Doctor's Appointment
            </a>
            <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
                <ul class="navbar-nav ml-auto mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/home}">
                            <i class="fa fa-home mr-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/userdetails}">
                            <i class="fa fa-medkit mr-1"></i>Appointments
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fa fa-sign-out mr-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="container mt-4">
        <!-- Search Section -->
        <div class="search-section">
            <form th:action="@{/doctors/search}" method="get" class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="name">Doctor Name</label>
                        <input type="text" class="form-control" id="name" name="name" th:value="${param.name}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="specialization">Specialization</label>
                        <input type="text" class="form-control" id="specialization" name="specialization" th:value="${param.specialization}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" class="form-control" id="state" name="state" th:value="${param.state}">
                    </div>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fa fa-search mr-2"></i>Search Doctors
                    </button>
                </div>
            </form>
        </div>

        <!-- Doctors List -->
        <div class="row">
            <div class="col-md-4" th:each="doctor : ${doctor}">
                <div class="card doctor-card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${doctor.name}">Doctor Name</h5>
                        <h6 class="card-subtitle mb-2 text-muted" th:text="${doctor.specialization}">Specialization</h6>
                        <p class="card-text">
                            <i class="fa fa-graduation-cap mr-2"></i>
                            <span th:text="${doctor.degree}">Degree</span>
                        </p>
                        <p class="card-text">
                            <i class="fa fa-map-marker mr-2"></i>
                            <span th:text="${doctor.city + ', ' + doctor.state}">Location</span>
                        </p>
                        <a th:href="@{'/doctor/' + ${doctor.email}}" class="btn btn-outline-primary">
                            View Profile & Book Appointment
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
