<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        .appointment-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .appointment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .doctor-info {
            border-left: 3px solid #007bff;
            padding-left: 10px;
        }
        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }
        .status-upcoming {
            background-color: #28a745;
            color: white;
        }
        .status-completed {
            background-color: #6c757d;
            color: white;
        }
        .status-cancelled {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top" style="font-family: 'Poppins', sans-serif;">
            <a class="navbar-brand text-capitalize" href="#">
                <img src="sign.jpg" width="40" height="40" alt="logo" loading="lazy" class="mr-2">Doctor's Appointment
            </a>
            <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
                <ul class="navbar-nav ml-auto mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/home}">
                            <i class="fa fa-home mr-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/appointments/available}">
                            <i class="fa fa-calendar mr-1"></i>Book Appointment
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/doctors}">
                            <i class="fa fa-user-md mr-1"></i>Find Doctors
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fa fa-sign-out mr-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="container mt-4">
        <h2 class="mb-4">My Appointments</h2>

        <!-- Appointments List -->
        <div class="row">
            <div class="col-md-6" th:each="appointment : ${appointments}">
                <div class="card appointment-card">
                    <div class="card-body">
                        <!-- Status Badge -->
                        <span th:class="'status-badge ' + 'status-' + ${appointment.appointmentStatus.status.toLowerCase()}"
                              th:text="${appointment.appointmentStatus.status}">Status</span>

                        <div class="doctor-info mb-3">
                            <h5 class="card-title" th:text="${appointment.doctor.name}">Doctor Name</h5>
                            <h6 class="card-subtitle text-muted" th:text="${appointment.doctor.specialization}">Specialization</h6>
                        </div>
                        <p class="card-text">
                            <i class="fa fa-calendar mr-2"></i>
                            <span th:text="${#temporals.format(appointment.date, 'MMMM dd, yyyy')}">Date</span>
                        </p>
                        <p class="card-text">
                            <i class="fa fa-clock-o mr-2"></i>
                            <span th:text="${#temporals.format(appointment.time, 'hh:mm a')}">Time</span>
                        </p>
                        <p class="card-text">
                            <i class="fa fa-map-marker mr-2"></i>
                            <span th:text="${appointment.doctor.city + ', ' + appointment.doctor.state}">Location</span>
                        </p>
                        <p class="card-text" th:if="${appointment.price}">
                            <i class="fa fa-money mr-2"></i>
                            <span th:text="'$' + ${appointment.price}">Price</span>
                        </p>

                        <!-- Actions -->
                        <div th:if="${appointment.appointmentStatus.status == 'UPCOMING'}" class="mt-3">
                            <form th:action="@{'/appointments/cancel'}" method="post" style="display: inline;">
                                <input type="hidden" name="appointmentId" th:value="${appointment.id}">
                                <button type="submit" class="btn btn-danger" 
                                        onclick="return confirm('Are you sure you want to cancel this appointment?')">
                                    <i class="fa fa-times mr-2"></i>Cancel Appointment
                                </button>
                            </form>
                            <a th:href="@{'/doctor/' + ${appointment.doctor.email}}" class="btn btn-outline-primary float-right">
                                <i class="fa fa-user-md mr-2"></i>View Doctor
                            </a>
                        </div>

                        <!-- Prescription Link for Completed Appointments -->
                        <div th:if="${appointment.appointmentStatus.status == 'COMPLETED' && appointment.prescription != null}" class="mt-3">
                            <a th:href="@{'/appointments/' + ${appointment.id} + '/prescription'}" class="btn btn-info w-100">
                                <i class="fa fa-file-text-o mr-2"></i>View Prescription
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(appointments)}" class="text-center mt-5">
            <i class="fa fa-calendar-o fa-4x text-muted mb-3"></i>
            <h4 class="text-muted">No appointments found</h4>
            <p class="text-muted">You don't have any appointments scheduled yet.</p>
            <a th:href="@{/appointments/available}" class="btn btn-primary mt-3">
                <i class="fa fa-plus mr-2"></i>Book an Appointment
            </a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
